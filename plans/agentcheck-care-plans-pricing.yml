note: >-
  Prices and included quotas were read from the machine-readable tier catalog at GET /api/tiers
  (HTTP 200, application/json, anonymous) on 2026-09-19 and cross-checked against the home page #pricing
  section and the two A2A skill descriptions, which state the same three paid prices. The tier ids
  (free, basic, full, enterprise) are the values POST /api/checkup and POST /api/checkout accept in the
  `tier` field. There is no enterprise "contact us" tier and no volume pricing; "enterprise" is simply the
  id of the $75 Deep Check. Refund terms come from https://agentcheck.care/terms section 3.3.
