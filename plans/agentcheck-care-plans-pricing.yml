upgrades:
  note: >-
    GET /api/checkout?tier=<id>&checkup_id=<free checkup id> creates a paid checkout that reuses the
    bot details from a completed free scan (302 to Stripe; the spec description states the user does not
    re-enter the bot URL).
refunds:
  policy: Full refund if the checkup fails because of AgentCheck's own error; no refunds for low scores.
  source: https://agentcheck.care/terms
  retry: If the bot is unreachable the checkup id stays valid and can be retried on the same payment (terms 3.4); POST /exam/{token}/relaunch recreates an expired paid exam session with the same parameters.
credits:
  note: >-
    GET /api/credits/balance exists ("Get credit balance for an API key") and answers 401 "Missing X-API-Key
    header" anonymously, so an API-key credit model exists in the code, but no page publishes how to obtain
    a key or what credits cost. Recorded as observed, not as a plan.
