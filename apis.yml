- aid: agentcheck-care:agentcheck-a2a-agent
  name: AgentCheck A2A Agent
  description: >-
    Agent2Agent (A2A 0.3.0) surface of the same service - a conformant agent card at
    /.well-known/agent-card.json declaring two text/plain skills, free-scan and paid-checkup, and an anonymous
    JSON-RPC 2.0 endpoint at /a2a. The paid skill returns a Stripe payment link that a human completes before
    testing begins. Listed on a2aregistry.org, which is how the company entered this catalog.
