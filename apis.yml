aid: agentcheck-care
name: AgentCheck
description: >-
  AgentCheck is an AI-agent diagnostic service at agentcheck.care: give it the URL of a bot - an A2A agent
  or an OpenAI-compatible chat endpoint - and it runs synthetic-persona conversations, OWASP LLM Top 10
  prompt-injection tests, PII-leakage scans, hallucination, over-refusal, bias and brand-alignment checks
  across ten modules, then delivers a scored report by magic link. A free scan needs no login; paid one-off
  tiers (Quick Check $10, Full Check $25, Deep Check $75) are bought through Stripe Checkout. The service is
  published as a 35-operation FastAPI OpenAPI 3.1.0 contract with Swagger UI and ReDoc, a machine-readable
  tier catalog and live free-scan quota endpoint, and is itself a conformant A2A 0.3.0 agent with two skills
  (free-scan, paid-checkup) served from the same host.
image: https://agentcheck.care/static/images/logo-ac-care.webp
url: https://raw.githubusercontent.com/api-evangelist/agentcheck-care/refs/heads/main/apis.yml
