apis:
- aid: agentcheck-care:agentcheck-checkup-api
  name: AgentCheck Checkup API
  description: >-
    REST API behind agentcheck.care - start free or paid diagnostic checkups of an AI bot, validate a target
    URL, read the tier catalog and the shared weekly free-scan pool, follow a running checkup over
    server-sent events, fetch the scored report, and drive the reverse-connection "exam" mode where the
    customer's bot calls a generated OpenAI-compatible endpoint. Served as a FastAPI OpenAPI 3.1.0 document
    with no declared securitySchemes; most operations are anonymous, the credits endpoint requires
    X-API-Key.
  image: https://agentcheck.care/static/images/logo-ac-care.webp
