  - agent_card__well_known_agent_card_json_get
  note: Every one of these answered an anonymous request without a challenge (200, 302 or a 404 on an unknown id). The A2A card declares no securitySchemes, consistent with the open endpoint.
customer_credentials_in_requests:
  note: >-
    CheckupRequest and CheckoutRequest carry an optional `api_key` field — the CUSTOMER's key for their
    own bot's chat API, which AgentCheck uses to call the bot under test. The privacy policy (1.3) states
    it is held in memory for the session only and never written to disk. This is a credential the caller
    sends, not one AgentCheck issues.
gaps:
- No securitySchemes in the OpenAPI; a generated client will treat /api/credits/balance as anonymous and get a 401.
- No developer page documents the X-API-Key credential or how to obtain one.
- No OAuth, no OIDC, no RFC 9728 protected-resource metadata (all /.well-known OAuth paths 404).
