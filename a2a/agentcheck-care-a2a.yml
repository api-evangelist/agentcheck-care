    Served at the A2A 1.0 / RFC 8615 canonical path on the apex host. www.agentcheck.care serves a
    byte-identical copy, and agentcheck.clinic (named in the privacy policy as a second domain)
    301-redirects to agentcheck.care/?v=tech, so there is one card and one host. The legacy
