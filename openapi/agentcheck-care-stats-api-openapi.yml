openapi: 3.2.0
info:
  title: AgentCheckup Stats API
  version: 0.1.0
tags:
- name: Stats
paths:
  /api/stats/public:
    get:
      summary: Get Public Stats
      description: 4 numbers for the landing page. No auth. Hidden below threshold.
      operationId: get_public_stats_api_stats_public_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Stats
  /api/stats/internal:
    get:
      summary: Get Internal Stats
      description: Full analytics breakdown. Requires ADMIN_STATS_TOKEN.
      operationId: get_internal_stats_api_stats_internal_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Stats
