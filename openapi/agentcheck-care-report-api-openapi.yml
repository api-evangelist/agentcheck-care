openapi: 3.2.0
info:
  title: AgentCheckup Report API
  version: 0.1.0
tags:
- name: Report
paths:
  /report/{checkup_id}:
    get:
      summary: Magic Link Report
      description: Serve a persisted report via magic link token + optional access code.
      operationId: magic_link_report_report__checkup_id__get
      parameters:
      - name: checkup_id
        in: path
        required: true
        schema:
          type: string
          title: Checkup Id
      - name: token
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Token
      - name: code
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Code
      - name: format
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Format
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Report
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
